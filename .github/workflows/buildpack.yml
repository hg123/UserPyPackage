name: Pyinstaller Package

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - { platform: x64, os: windows-latest }
          - { platform: x86, os: windows-latest }


    name: main-${{ matrix.platform }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 设置Python版本
        uses: actions/setup-python@v4
        with:
          python-version: 3.7
          architecture: ${{ matrix.platform }}

      - name: 安装Python依赖包
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt

      - name: 打包(只能是main.py)
        run: |
          pyinstaller --onefile --add-data "favicon.ico;." main.py  # ;. means put it in the root

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: Python-Package-${{ matrix.os }}-${{ matrix.platform }}
          path: dist/
